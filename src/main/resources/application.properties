# ==========================================
# INFRAESTRUTURA E PORTA (Railway Dinâmica)
# ==========================================
server.port=${PORT:8080}

# ==========================================
# BANCO DE DADOS E POOL (Hikari)
# ==========================================
# A Railway injeta MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER e MYSQLPASSWORD automaticamente
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:segundocerebro_db}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}

spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.initialization-fail-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# ==========================================
# MIGRATIONS E ORM (Segurança de Produção)
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.flyway.locations=classpath:db/migrations

# ==========================================
# SEGURANÇA E JWT
# ==========================================
api.security.token.secret=${JWT_SECRET:FrQuOQySCOJJhmn4OCFCpSKFbECJ0Fg6e9JmFlg4Ebo=}
spring.threads.virtual.enabled=true

# Configuração para HTTPS em Produção (Proxy Reverso)
server.forward-headers-strategy=framework
springdoc.show-actuator=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs