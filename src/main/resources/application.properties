# ==========================================
# INFRAESTRUTURA E PORTA (Railway Dinâmica)
# ==========================================
server.port=${PORT:8080}

# ==========================================
# BANCO DE DADOS E POOL (Hikari)
# ==========================================
# A Railway injeta MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER e MYSQLPASSWORD automaticamente
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:segundocerebro_db}?createDatabaseIfNotExist=true&characterEncoding=UTF-8
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}

spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.initialization-fail-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# ==========================================
# MIGRATIONS E ORM (Segurança de Produção)
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.flyway.locations=classpath:db/migrations

# ==========================================
# SEGURANÇA E JWT
# ==========================================
# Sem valor default de proposito: o boot deve falhar se JWT_SECRET nao estiver definido,
# em vez de assinar tokens com uma chave conhecida. Gere com: openssl rand -base64 32
api.security.token.secret=${JWT_SECRET}
spring.threads.virtual.enabled=true

# Configuração para HTTPS em Produção (Proxy Reverso)
server.forward-headers-strategy=framework
springdoc.show-actuator=false
# Swagger acessivel sem autenticacao apenas quando habilitado explicitamente.
app.api-docs.public=${API_DOCS_PUBLIC:false}

# Origens permitidas no CORS, separadas por virgula. Sem curinga: setAllowedOrigins
# nao interpreta "*" no meio do dominio, e usar setAllowedOriginPatterns com
# allowCredentials liberaria subdominios de terceiros.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Limite de tentativas por IP nos endpoints publicos sensiveis
app.rate-limit.login.max-attempts=${RATE_LIMIT_LOGIN_ATTEMPTS:10}
app.rate-limit.login.window-minutes=${RATE_LIMIT_LOGIN_WINDOW:5}
app.rate-limit.forgot-password.max-attempts=${RATE_LIMIT_FORGOT_ATTEMPTS:3}
app.rate-limit.forgot-password.window-minutes=${RATE_LIMIT_FORGOT_WINDOW:15}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ==========================================
# EMAIL E SMTP
# ==========================================
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# APLICAÇÃO (Frontend, Planos, Bíblia, Pagamento)
# ==========================================
# URL pública do frontend (usada em links de e-mail e redirecionamentos de pagamento)
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.mail.from=${MAIL_FROM:${SMTP_USERNAME:no-reply@acervo.app}}

# Limites do plano FREE (PRO = ilimitado)
app.plan.free.max-notes=${PLAN_FREE_MAX_NOTES:5}
app.plan.free.max-themes=${PLAN_FREE_MAX_THEMES:3}

# Provedor de textos bíblicos (https://bolls.life)
app.bible.base-url=${BIBLE_API_URL:https://bolls.life}
app.bible.default-translation=${BIBLE_DEFAULT_TRANSLATION:ACF11}
spring.cache.cache-names=bibleChapters,bibleSearch
spring.cache.caffeine.spec=maximumSize=5000,expireAfterWrite=7d

# Pagamento: provider "mock" até a integração com o gateway real
app.payment.provider=${PAYMENT_PROVIDER:mock}
app.payment.pro-price-cents=${PAYMENT_PRO_PRICE_CENTS:1990}
app.payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET:}
# Libera POST /api/v1/payment/simulate-upgrade. Default false: so dev habilita.
app.payment.allow-simulated-upgrade=${PAYMENT_ALLOW_SIMULATED_UPGRADE:false}
