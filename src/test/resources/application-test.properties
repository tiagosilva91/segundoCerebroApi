# Banco de TESTE, separado do de desenvolvimento. Cada teste limpa as tabelas:
# apontar isto para segundocerebro_db apagaria as notas reais.
# Localmente: docker compose up -d mysqldb. No CI: service container.
spring.datasource.url=jdbc:mysql://${TEST_MYSQL_HOST:localhost}:${TEST_MYSQL_PORT:3306}/segundocerebro_test?createDatabaseIfNotExist=true&characterEncoding=UTF-8
spring.datasource.username=${TEST_MYSQL_USER:root}
spring.datasource.password=${TEST_MYSQL_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations

api.security.token.secret=segredo-de-teste-nao-usar-em-producao

# Nao enviar e-mail de verdade nos testes
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=
spring.mail.password=

app.frontend-url=http://localhost:3000
app.payment.provider=mock
app.payment.webhook-secret=segredo-webhook-teste
app.payment.allow-simulated-upgrade=false
app.api-docs.public=false
app.cors.allowed-origins=http://localhost:3000

# Limites altos para nao interferir nos testes que nao sao de rate limit
app.rate-limit.login.max-attempts=1000
app.rate-limit.login.window-minutes=1
app.rate-limit.forgot-password.max-attempts=1000
app.rate-limit.forgot-password.window-minutes=1

logging.level.org.flywaydb=WARN
logging.level.org.hibernate=WARN
