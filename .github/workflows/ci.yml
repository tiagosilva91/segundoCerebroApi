name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Os testes de integracao rodam contra MySQL real: as migrations Flyway usam
    # sintaxe especifica de MySQL e a colacao das tabelas e justamente o que a
    # suite exercita. H2 esconderia essa classe de falha.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Testes
        run: mvn --batch-mode test
        env:
          TEST_MYSQL_HOST: 127.0.0.1
          TEST_MYSQL_PORT: "3306"
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: root

      - name: Build
        run: mvn --batch-mode package -DskipTests

      - name: Publicar relatorios em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
